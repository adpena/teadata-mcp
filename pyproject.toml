[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "teadata-mcp"
version = "0.1.0"
description = "Model Context Protocol server scaffolding for the TEA Data Engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.pytest.ini_options]
pythonpath = [
    "src",
    "knowledge/teadata",
]
