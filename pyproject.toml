[project]
name = "teadata-mcp"
version = "0.0.1"
description = "Texas Education Data Explorer: A Model Context Protocol server for public school data."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Alejandro Peña", email = "adpena@gmail.com" }
]
dependencies = [
    "modelcontextprotocol>=1.0.1",
    "slowapi>=0.1.9",
    "sse-starlette>=3.0.4",
    "starlette>=0.50.0",
    "teadata",
    "uvicorn>=0.40.0",
]

[project.scripts]
teadata-mcp = "teadata_mcp.server:run"

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.uv.sources]
teadata = { git = "https://github.com/adpena/teadata.git" }

[tool.pytest.ini_options]
pythonpath = [
    "src",
]
testpaths = ["tests"]
